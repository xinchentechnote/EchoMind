name: diag

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: 探测各 Maven 仓库上 KSP 插件 marker 的真实响应
        run: |
          set -u
          MARKER="com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.3.12/com.google.devtools.ksp.gradle.plugin-2.3.12.pom"
          CONTROL="com/android/tools/build/gradle/9.4.1/gradle-9.4.1.pom"
          for base in \
            "https://maven.aliyun.com/repository/gradle-plugin" \
            "https://maven.aliyun.com/repository/public" \
            "https://maven.aliyun.com/repository/google" \
            "https://repo.maven.apache.org/maven2" \
            "https://repo1.maven.org/maven2" \
            "https://plugins.gradle.org/m2" \
            "https://dl.google.com/dl/android/maven2"; do
            get=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -L "$base/$MARKER")
            head=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -I -L "$base/$MARKER")
            ctl=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -L "$base/$CONTROL")
            echo "GET=$get HEAD=$head CONTROL(AGP pom)=$ctl  $base"
          done
      - name: 看 Gradle 实际打了哪些 URL
        run: |
          set -u
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          export JAVA_HOME="$(ls -d /usr/lib/jvm/*temurin*17* /usr/lib/jvm/java-17* 2>/dev/null | head -1)"
          echo "JAVA_HOME=$JAVA_HOME"
          ./gradlew --info --no-daemon help 2>&1 | grep -i -E "ksp|aliyun|Gradle Central|Downloading|Resource missing" | head -60
