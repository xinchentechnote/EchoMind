name: CI

# 只做本机验证路径里可重复的两步：:app:assembleDebug + :app:testDebugUnitTest。
# 仪器化测试（48 项，Room Migration / Repository）需要 emulator，本工作流不跑，原因记在 docs/testing.md §2。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建与 JVM 单测
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      JAVA_VERSION: "17"
    steps:
      - uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: 定位 Android SDK
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ]; then
            echo "runner 上没有 Android SDK：$SDK_DIR" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          # 仓库里不含 local.properties（已 gitignore），AGP 需要它或 ANDROID_HOME 才能定位 SDK
          echo "sdk.dir=$SDK_DIR" > local.properties
          echo "sdk.dir=$SDK_DIR"
          command -v sdkmanager || {
            echo "找不到 sdkmanager（期望在 $SDK_DIR/cmdline-tools/latest/bin）" >&2
            ls -1 "$SDK_DIR" >&2
            exit 1
          }

      - name: 安装 compileSdk 37 平台与 build-tools 37.0.0
        run: |
          set -euo pipefail
          # 包名斜杠/分号两种格式取决于 cmdline-tools 版本，本机实测只有斜杠能用（docs/environment.md），
          # runner 上的版本可能是旧的，所以两种都试一次。
          for pkg in "platforms/android-37.0" "build-tools/37.0.0"; do
            if yes | sdkmanager --sdk_root="$ANDROID_HOME" --install "$pkg" 2>/dev/null ||
               yes | sdkmanager --sdk_root="$ANDROID_HOME" --install "${pkg//\//;}"; then
              echo "已安装 $pkg"
            else
              echo "安装 $pkg 失败" >&2
              sdkmanager --sdk_root="$ANDROID_HOME" --list_installed >&2 || true
              exit 1
            fi
          done

      - name: 准备 Gradle（缓存 wrapper 与依赖）
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: 构建调试包并跑 JVM 单元测试
        run: ./gradlew --stacktrace :app:assembleDebug :app:testDebugUnitTest

      - name: 上传单元测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          retention-days: 7

      - name: 上传调试 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
