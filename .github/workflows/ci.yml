name: CI

# 只做本机验证路径里可重复的两步：:app:assembleDebug + :app:testDebugUnitTest。
# 仪器化测试（48 项，Room Migration / Repository）需要 emulator，本工作流不跑，原因记在 docs/testing.md §2。
on:
  push:
    branches: [main]
    # 版本标签（v0.1 等）也出包：产物名带标签号（EchoMind-v0.1-debug），作为该版本的交付物
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建与 JVM 单测
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # runner 镜像实测已自带这两项（见 docs/environment.md §8），所以正常路径只需要校验，不需要 sdkmanager
      REQUIRED_PLATFORM: platforms/android-37.0
      REQUIRED_BUILD_TOOLS: build-tools/37.0.0
    steps:
      - uses: actions/checkout@v7

      - name: 准备 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: 校验 Android SDK（compileSdk 37 与 build-tools 37.0.0）
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ]; then
            echo "runner 上没有 Android SDK：$SDK_DIR" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          # 仓库里不含 local.properties（已 gitignore），显式写一份给 AGP 定位 SDK
          echo "sdk.dir=$SDK_DIR" > local.properties
          echo "sdk.dir=$SDK_DIR"

          missing=""
          for d in "$REQUIRED_PLATFORM" "$REQUIRED_BUILD_TOOLS"; do
            [ -d "$SDK_DIR/$d" ] || missing="$missing $d"
          done
          if [ -z "$missing" ]; then
            echo "所需组件齐备"
            exit 0
          fi

          echo "缺少：$missing，尝试用 sdkmanager 补装" >&2
          SDKMGR="$(ls "$SDK_DIR"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKMGR" ]; then
            echo "既没有预装组件也找不到 sdkmanager，无法继续" >&2
            ls -1 "$SDK_DIR" "$SDK_DIR/cmdline-tools" >&2 || true
            exit 1
          fi
          # 包名斜杠/分号两种格式取决于 cmdline-tools 版本（本机只有斜杠能用，见 docs/environment.md §5）
          yes | "$SDKMGR" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
          for d in $missing; do
            "$SDKMGR" --sdk_root="$SDK_DIR" --install "$d" ||
              "$SDKMGR" --sdk_root="$SDK_DIR" --install "${d//\//;}"
          done

      - name: 缓存 sherpa-onnx AAR
        uses: actions/cache@v6
        with:
          path: ~/.cache/echomind-libs
          key: sherpa-onnx-static-link-1.13.8-b22c3fc1

      - name: 取回并校验 sherpa-onnx AAR
        run: |
          set -euo pipefail
          # 38.7 MB 的二进制依赖不入库（.gitignore 排掉 app/libs/），CI 每次按钉住的 URL+哈希取回。
          # 哈希不匹配就直接失败，别把来路不明的文件喂进构建（AGENTS.md §5）。
          AAR=sherpa-onnx-static-link-onnxruntime-1.13.8.aar
          CACHE_DIR="$HOME/.cache/echomind-libs"
          if [ ! -f "$CACHE_DIR/$AAR" ]; then
            mkdir -p "$CACHE_DIR"
            curl -sSL --retry 3 -o "$CACHE_DIR/$AAR" \
              "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/$AAR"
          fi
          echo "b22c3fc1b6a45666d28892bb2f7694beeb77a8362d7ebd77c1a5431ec9435471  $CACHE_DIR/$AAR" | sha256sum -c -
          mkdir -p app/libs
          cp "$CACHE_DIR/$AAR" app/libs/

      - name: 缓存内置模型
        uses: actions/cache@v6
        with:
          path: ~/.cache/echomind-models
          key: bundled-models-f36a0433-59aba887-9e2449e1

      - name: 取回并校验内置模型
        run: |
          set -euo pipefail
          # 模型不入仓库（.gitignore 排掉 assets/models/），CI 按清单里的钉住哈希取回后放进 assets。
          # 构建脚本对同一组文件还会再做一遍「存在 + 字节数」检查，两道闸都不过就别想打出 APK（AGENTS.md §5）。
          # runner 直连 huggingface.co / github.com 没有问题（超时只发生在本机网络，见 docs/environment.md）。
          CACHE_DIR="$HOME/.cache/echomind-models"
          mkdir -p "$CACHE_DIR" app/src/main/assets/models/paraformer-zh-2023-09-14-int8 app/src/main/assets/models/silero-vad
          fetch() { # fetch <缓存名> <URL> <sha256>
            if [ ! -f "$CACHE_DIR/$1" ]; then
              curl -sSL --retry 3 -o "$CACHE_DIR/$1" "$2"
            fi
            echo "$3  $CACHE_DIR/$1" | sha256sum -c -
            cp "$CACHE_DIR/$1" "$4"
          }
          fetch model.int8.onnx \
            "https://huggingface.co/csukuangfj/sherpa-onnx-paraformer-zh-2023-09-14/resolve/main/model.int8.onnx" \
            f36a0433bcf096bd6d6f11b80a3ac8bed110bdca632fe0d731df8d1a84475945 \
            app/src/main/assets/models/paraformer-zh-2023-09-14-int8/model.int8.onnx
          fetch tokens.txt \
            "https://huggingface.co/csukuangfj/sherpa-onnx-paraformer-zh-2023-09-14/resolve/main/tokens.txt" \
            59aba8873a2ed1e122c25fee421e25f283b63290efbde85c1f01a853d83cb6e6 \
            app/src/main/assets/models/paraformer-zh-2023-09-14-int8/tokens.txt
          fetch silero_vad.onnx \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx" \
            9e2449e1087496d8d4caba907f23e0bd3f78d91fa552479bb9c23ac09cbb1fd6 \
            app/src/main/assets/models/silero-vad/silero_vad.onnx

      - name: 缓存并取回 libwma.so（WMA 解码，D40）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 自建的 FFmpeg 最小裁剪 JNI 库（LGPL-2.1-or-later），构建脚本见 docs/architecture.md D40。
          # 私有仓库的 release 资产要带 token（gh 自带，经 env 注入）；哈希钉住，不匹配即失败。
          CACHE_DIR="$HOME/.cache/echomind-libs"
          mkdir -p "$CACHE_DIR" app/libs/wma-jni/arm64-v8a
          if [ ! -f "$CACHE_DIR/libwma.so" ]; then
            gh release download v0.1.1 -R xinchentechnote/EchoMind \
              -p "libwma-arm64-v8a-dc064aed.so" -O "$CACHE_DIR/libwma.so"
          fi
          echo "dc064aede3aaefb5204989af3748f52d7c3b3a0309555165ebf2c561fe2a530e  $CACHE_DIR/libwma.so" | sha256sum -c -
          cp "$CACHE_DIR/libwma.so" app/libs/wma-jni/arm64-v8a/libwma.so

      - name: 准备 Gradle（缓存 wrapper 与依赖）
        uses: gradle/actions/setup-gradle@v6

      - name: 构建调试包并跑 JVM 单元测试
        run: ./gradlew --stacktrace :app:assembleDebug :app:testDebugUnitTest

      - name: 上传单元测试报告
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          retention-days: 7

      - name: 上传调试 APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: EchoMind-${{ github.ref_name }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          # 单个 APK ~216MB：free 层账户 Actions 存储配额全账户共 500MB，
          # 14 天 × ~1.4 次/天 会常驻 4GB+（曾顶爆配额殃及其他仓库上传）。
          # 只保最近构建；要长期分发请打 tag 挂 Release（不计入此配额）。
          retention-days: 1
