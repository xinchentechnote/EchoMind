org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# 保持 AGP 9 的 built-in Kotlin（实测内置 Kotlin 编译器等价 2.4.21），Room 走 KSP。
# 不要在这里打开 android.builtInKotlin=false：独立 KGP 路线上 Kotlin 2.3.12 并不存在
# （实测 kotlin-gradle-plugin 只有 2.3.20/2.3.21/2.4.x），且 kapt 与 built-in Kotlin 不兼容。

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
